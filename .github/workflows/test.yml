name: Tests

on:
  push:
  pull_request:
    branches: [main, master]

# Pushing to a branch with an open PR fires both events, and the E2E specs run
# serially. Supersede the older run instead of queueing it — except on main,
# where the run is the record of the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 18 is EOL and the toolchain no longer runs on it: jsdom 30 wants
        # ^22.22.2 || ^24.15.0 || >=26, and vite 8, vitest 4 and eslint 10 want
        # >=20.19. 24.x is the current LTS and satisfies all of them.
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      # Covers both TS projects. `tsconfig.app.json` alone left tsup.config.ts,
      # vitest.config.ts and playwright.config.ts unchecked.
      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Every finding is either resolved with evidence in REVIEW-FINDINGS.md or
      # open with a reason in BACKLOG.md.
      - name: Check docs
        run: pnpm check-docs

      # Before check-exports, which reads dist/. Without it `attw` reports
      # "This package does not contain types" and exits 0 — a green no-op.
      - name: Build
        run: pnpm build

      - name: Check exports
        run: pnpm check-exports

      # `test:run`, not `test`: bare `vitest` only runs once because Vitest
      # disables watch when CI is set. Relying on that leaves CI one env var away
      # from hanging until the job times out.
      - name: Run tests
        run: pnpm test:run

      - name: Run E2E tests
        run: pnpm testE2E
