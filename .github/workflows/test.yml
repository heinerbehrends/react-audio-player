name: Tests

on:
  push:
  pull_request:
    branches: [main, master]

# Pushing to a branch with an open PR fires both events, and the E2E specs run
# serially. Supersede the older run instead of queueing it — except on main,
# where the run is the record of the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    name: node ${{ matrix.node-version }} · react ${{ matrix.react-version }}

    strategy:
      # Both legs report. A failure on one end of the peer range should not
      # cancel the run that would have said whether the other end is fine too.
      fail-fast: false
      matrix:
        # Node 18 is EOL and the toolchain no longer runs on it: jsdom 30 wants
        # ^22.22.2 || ^24.15.0 || >=26, and vite 8, vitest 4 and eslint 10 want
        # >=20.19. 24.x is the current LTS and satisfies all of them.
        node-version: [24.x]
        # `peerDependencies` promises `react: >=18.0.0`, and devDependencies can
        # pin only one version — so the far end of that range was never run
        # (S19). Both ends now run the whole gauntlet. Type-check earns its place
        # in both: the one real React 19 difference found so far was a type, not
        # a behaviour (a ref callback may now return a cleanup function, which
        # makes a concise arrow returning anything else an error).
        react-version: ["18", "19"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # The lockfile pins React 18, so only the other leg has anything to do.
      # `react-dom` moves in lockstep — it is no longer a peer dependency (S18),
      # but the demo app mounts with it and the jsdom suite renders with it, and
      # a React 19 / react-dom 18 pair fails at import.
      - name: Install React ${{ matrix.react-version }}
        if: matrix.react-version != '18'
        run: >-
          pnpm add -D
          react@${{ matrix.react-version }}
          react-dom@${{ matrix.react-version }}
          @types/react@${{ matrix.react-version }}
          @types/react-dom@${{ matrix.react-version }}

      # Both projects in playwright.config.ts, so both engines are installed.
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      # Covers all three TS projects. `tsconfig.app.json` alone left tsup.config.ts,
      # vitest.config.ts and playwright.config.ts unchecked.
      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Every ticket in issues/ matches the frontmatter contract, sits in the
      # folder its status calls for, and is listed in the generated index.
      - name: Check issues
        run: pnpm issues:check

      # Before check-exports, which reads dist/. Without it `attw` reports
      # "This package does not contain types" and exits 0 — a green no-op.
      - name: Build
        run: pnpm build

      - name: Check exports
        run: pnpm check-exports

      # `test:run`, not `test`: bare `vitest` only runs once because Vitest
      # disables watch when CI is set. Relying on that leaves CI one env var away
      # from hanging until the job times out.
      - name: Run tests
        run: pnpm test:run

      - name: Run E2E tests
        run: pnpm testE2E

      # `always()`, because the run that matters is the one that just failed —
      # `test-results/` holds the ARIA snapshot (`error-context.md`) and, for a
      # retried spec, the trace that says what the page was doing. Without this
      # both are deleted with the runner and a CI failure can only be guessed at.
      #
      # Named per matrix leg: upload-artifact@v4 rejects a second upload under a
      # name already used in the same run.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-react-${{ matrix.react-version }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
